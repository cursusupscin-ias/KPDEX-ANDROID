name: Build KPDEX APK

on:
  push:
    tags: ['v*']          # e.g. git tag v1.0.0 && git push --tags
  workflow_dispatch:      # or press "Run workflow" in the Actions tab

permissions:
  contents: write         # needed to publish the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Patch manifest and version
        run: node scripts/patch-android.mjs

      - name: Generate app icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#FFFFFF'

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p out
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk out/aligned.apk
            "$BT/apksigner" sign --ks release.keystore --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --out out/KPDEX.apk out/aligned.apk
            rm -f release.keystore out/aligned.apk
          else
            echo "No keystore secret found - using debug-signed APK (updates over a previous install will fail)."
            cp android/app/build/outputs/apk/debug/app-debug.apk out/KPDEX.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: KPDEX-apk
          path: out/KPDEX.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/KPDEX.apk
          generate_release_notes: true
